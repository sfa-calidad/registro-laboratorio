name: Build desktop (.exe)

# Genera el instalador de Windows en un runner de Windows y lo sube como artefacto.
# Se ejecuta manualmente desde la pestaña "Actions" del repositorio.
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Construir instalador
        run: npm run dist

      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: registro-laboratorio-instalador
          path: |
            desktop/dist/*.exe
